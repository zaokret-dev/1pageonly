<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | One Page Only</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0d0d0d; --dark: #131920; --dark2: #181f28; --white: #ffffff;
      --gold: #e8a020; --gold2: #f5b432; --muted: #a3b2c4; --border: rgba(255,255,255,0.07);
    }
    html, body { overflow-x: hidden; width: 100%; }
    body { font-family: 'Manrope', sans-serif; background: var(--dark); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 0 6%; height: 68px; border-bottom: 1px solid var(--border); }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 3px; color: var(--white); text-decoration: none; }
    .logo span { color: var(--gold); }
    .nav-cta { background: var(--gold); color: var(--black); padding: 0.6rem 1.4rem; font-weight: 700; font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; text-decoration: none; white-space: nowrap; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 80px 6%; position: relative; overflow: hidden; }
    .glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 700px; height: 400px; border-radius: 50%; background: radial-gradient(ellipse, rgba(232,160,32,0.08) 0%, transparent 70%); pointer-events: none; }
    .code { font-family: 'Bebas Neue', sans-serif; font-size: clamp(7rem, 22vw, 13rem); line-height: 0.9; color: var(--gold); letter-spacing: 4px; position: relative; }
    h1 { font-family: 'Bebas Neue', sans-serif; font-weight: 400; font-size: clamp(2.4rem, 6vw, 4rem); line-height: 1; letter-spacing: 2px; margin-top: 0.5rem; position: relative; }
    p { margin-top: 1.25rem; max-width: 480px; font-size: 1.05rem; line-height: 1.7; color: var(--muted); position: relative; }
    .actions { margin-top: 2.5rem; display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; position: relative; }
    .btn { padding: 1.05rem 2rem; font-weight: 700; font-size: 0.88rem; letter-spacing: 1.5px; text-transform: uppercase; text-decoration: none; transition: background 0.2s, color 0.2s, border-color 0.2s; }
    .btn-gold { background: var(--gold); color: var(--black); }
    .btn-gold:hover { background: var(--gold2); }
    .btn-outline { border: 1px solid rgba(255,255,255,0.2); color: var(--white); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .links { margin-top: 2.5rem; display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; position: relative; }
    .links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
    .links a:hover { color: var(--gold); }
    footer { background: var(--black); padding: 2rem 6%; text-align: center; border-top: 1px solid var(--border); }
    footer p { margin: 0 auto; font-size: 0.8rem; }
    @media (max-width: 600px) {
      nav { padding: 0 5%; height: 60px; }
      .logo { font-size: 1.35rem; letter-spacing: 2px; }
      .nav-cta { padding: 0.55rem 1rem; font-size: 0.72rem; }
      .actions { flex-direction: column; align-items: stretch; width: 100%; max-width: 340px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="logo">One<span>Page</span>Only</a>
  <a href="/#cta-bottom" class="nav-cta">Get Started</a>
</nav>

<main>
  <div class="glow"></div>
  <div class="code">404</div>
  <h1>This Page Doesn't Exist</h1>
  <p>The link may be old or mistyped. Everything you need is just one click away.</p>
  <div class="actions">
    <a href="/" class="btn btn-gold">Go to Homepage</a>
    <a href="mailto:info@1pageonly.com?subject=Website%20for%20my%20business" class="btn btn-outline">&#9993; Email Us</a>
  </div>
  <div class="links">
    <a href="/#portfolio">Example Sites</a>
    <a href="/#pricing">Pricing</a>
    <a href="/blog/">Blog</a>
    <a href="/pay">Pay Online</a>
  </div>
</main>

<footer>
  <p>&copy; 2026 One Page Only &middot; Serving contractors across the US</p>
</footer>

</body>
</html>
